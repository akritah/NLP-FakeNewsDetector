experiment:
  name: cross_attention_emotion
  output_dir: outputs/research
  smoke_test: false
  smoke_size: 32

dataset:
  csv_path: data/raw/fakeddit_verified.csv
  image_dir: data/raw/images
  split_dir: data/splits
  text_column: title
  image_column: image_url
  label_column: label
  label_mapping:
    "0": 0
    "1": 1
  max_seq_length: 128

model:
  text_encoder:
    checkpoint: roberta-base
    freeze: true
    pooling: cls
  visual_encoder:
    type: vit
    checkpoint: google/vit-base-patch16-224
    freeze: true
  emotion_encoder:
    checkpoint: distilbert-base-uncased
    freeze: true
  emotion_features: true
  fusion_method: cross_attention
  hidden_dim: 256
  dropout: 0.1
  cross_modal_consistency: false

training:
  batch_size: 32
  learning_rate: 0.00002
  epochs: 10
  weight_decay: 0.01
  early_stopping_patience: 3
  mixed_precision: true
  seed: 42
